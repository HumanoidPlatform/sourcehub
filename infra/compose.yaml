# =============================================================================
# SourceHub — local development stack
#
# Run from the repo root via the Makefile (`make up`), or directly:
#
#   docker compose -f infra/compose.yaml up -d
#   docker compose -f infra/compose.yaml logs -f postgres
#   docker compose -f infra/compose.yaml down          # keeps data
#   docker compose -f infra/compose.yaml down -v       # wipes data, reapplies db/
#
# Compose reads infra/.env for the values below. Application secrets live in
# backend/.env and never appear here; browser-visible config lives in
# frontend/.env. Three files, each owned by the thing that reads it.
#
# The db/ directory is mounted into Postgres's init directory, so every .sql
# file runs in filename order the FIRST time the volume is created. Editing a
# .sql file and restarting does nothing — you must `down -v` to reapply.
#
# Service names double as hostnames on the sourcehub network, so the API
# reaches Postgres at postgres:5432, not localhost.
# =============================================================================

name: sourcehub

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — the transactional tier and the tenancy boundary.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sourcehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourcehub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Deterministic collation, so ORDER BY does not differ between a
      # developer's machine and production.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first init, in filename order.
      # Relative to THIS file, which now lives in infra/.
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sourcehub}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [sourcehub]

  # ---------------------------------------------------------------------------
  # Redis — Celery broker and result backend, plus the API's cache.
  # Three queues (media, qa, notify) share this instance in development.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sourcehub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sourcehub]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage, standing in for Azure Blob.
  #
  # asset.storage_key points here. The bytes never traverse the application
  # tier: uploads go straight from the capture device to a pre-signed URL.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sourcehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sourcehub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sourcehub_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [sourcehub]

  # Creates the buckets once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: sourcehub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sourcehub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sourcehub_dev_password}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/sourcehub-assets;
      mc mb --ignore-existing local/sourcehub-documents;
      mc mb --ignore-existing local/sourcehub-bundles;
      mc anonymous set none local/sourcehub-assets;
      echo 'buckets ready';
      "
    networks: [sourcehub]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Mailpit — catches every outbound email in development.
  #
  # Not optional for this build. The onboarding flow issues an invitation token
  # by email and the user sets their own password from that link; with no mail
  # catcher there is no way to complete an onboarding locally.
  #
  # SMTP on 1025, web UI on 8025.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: sourcehub-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [sourcehub]

  # ---------------------------------------------------------------------------
  # pgAdmin — browse the schema without a local client.
  # Optional: `docker compose --profile tools up -d` to include it.
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sourcehub-pgadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sourcehub.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-sourcehub}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sourcehub]

  # ---------------------------------------------------------------------------
  # APPLICATION SERVICES — not yet enabled.
  #
  # These are left commented rather than added behind a profile because there is
  # no source to build yet: an enabled service with no code turns `make up` from
  # "a working database in ninety seconds" into a build failure. Uncomment each
  # one as its Dockerfile gains something to copy — api first, then worker, then
  # web. The infra above needs no changes when you do.
  #
  # Note the hostnames: on this network the API reaches Postgres at
  # postgres:5432 and Redis at redis:6379, never at localhost.
  # ---------------------------------------------------------------------------
  # api:
  #   build:
  #     context: ..
  #     dockerfile: backend/Dockerfile
  #   container_name: sourcehub-api
  #   command: uvicorn sourcehub.main:app --host 0.0.0.0 --port 8000 --reload
  #   env_file: [../backend/.env]
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://sourcehub_app:${SOURCEHUB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-sourcehub}
  #     REDIS_URL: redis://redis:6379/0
  #     STORAGE_ENDPOINT: http://minio:9000
  #     SMTP_HOST: mailpit
  #   ports: ["${API_PORT:-8000}:8000"]
  #   volumes: ["../backend/src:/app/src:ro"]   # hot reload
  #   depends_on:
  #     postgres: {condition: service_healthy}
  #     redis:    {condition: service_healthy}
  #   networks: [sourcehub]
  #
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: backend/Dockerfile
  #   container_name: sourcehub-worker
  #   command: celery -A sourcehub.worker.celery_app worker -Q media,qa,notify -l info
  #   env_file: [../backend/.env]
  #   depends_on:
  #     postgres: {condition: service_healthy}
  #     redis:    {condition: service_healthy}
  #   networks: [sourcehub]
  #
  # web:
  #   build:
  #     context: ../frontend
  #     dockerfile: Dockerfile
  #   container_name: sourcehub-web
  #   ports: ["${WEB_PORT:-5173}:5173"]
  #   env_file: [../frontend/.env]
  #   networks: [sourcehub]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:

networks:
  sourcehub:
    driver: bridge
