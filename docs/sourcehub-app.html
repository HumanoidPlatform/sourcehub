<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>SourceHub Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================================================================
   SOURCEHUB CONSOLE — production reference implementation
   ----------------------------------------------------------------------------
   LAYER 1 · TOKENS      every colour, size and duration used by the product
   LAYER 2 · PRIMITIVES  reset, typography, focus
   LAYER 3 · COMPONENTS  rail, topbar, panel, table, pill, button, field, ...
   LAYER 4 · UTILITIES   grid and spacing helpers
   Components read tokens only. No component declares a colour inside a
   @media or [data-theme] block — themes swap the token values, nothing else.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   LAYER 1 · TOKENS — light is the base definition
--------------------------------------------------------------------------- */
:root{
  /* --- surfaces & ink (neutrals biased cool-green, not pure grey) --- */
  --ground:#f4f6f5;
  --surface:#ffffff;
  --surface-2:#eef1ef;
  --surface-3:#e6eae8;
  --line:#dde3e0;
  --line-strong:#c3ccc8;
  --ink:#0f1a1c;
  --ink-2:#3a4a4d;
  --ink-3:#66787b;
  --ink-4:#8c9c9e;

  /* --- accent: petrol teal, from survey instrumentation --- */
  --accent:#0a6c60;
  --accent-hover:#085248;
  --accent-ink:#ffffff;
  --accent-tint:#e2efec;
  --accent-line:#a9cfc8;

  /* --- status taxonomy: five tones, deliberately distinct from the accent
         neutral   inert, nothing is happening
         active    progressing, no one is blocked
         attention waiting on a human decision
         success   terminal, good
         critical  terminal, bad — or a breach                       --- */
  --t-neutral:#5b6b6e;    --t-neutral-bg:#eceeed;   --t-neutral-line:#d3d9d7;
  --t-active:#0a6c60;     --t-active-bg:#e2efec;    --t-active-line:#a9cfc8;
  --t-attention:#8f5000;  --t-attention-bg:#faeedb;  --t-attention-line:#e6cb9c;
  --t-success:#1a6f45;    --t-success-bg:#e4f1ea;   --t-success-line:#a6d3bb;
  --t-critical:#a9312a;   --t-critical-bg:#fbe9e7;  --t-critical-line:#eeb8b2;

  /* --- data visualisation --- */
  --meter-track:#e0e5e3;
  --chart-grid:#e6eae8;

  /* --- geometry --- */
  --r-control:4px; --r-panel:6px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --rail-w:264px; --rail-w-min:64px; --topbar-h:56px; --view-max:1440px;

  /* --- elevation: flat product, shadow reserved for things that float --- */
  --shadow-pop:0 4px 12px rgba(15,26,28,.10), 0 1px 3px rgba(15,26,28,.08);
  --shadow-overlay:0 24px 48px -12px rgba(15,26,28,.28), 0 0 0 1px var(--line);

  /* --- motion --- */
  --fast:120ms; --base:180ms; --ease:cubic-bezier(.2,.6,.35,1);

  /* --- type --- */
  --font-ui:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,monospace;
}

/* dark, for viewers on the system default (no data-theme stamp present) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0d1315; --surface:#141c1e; --surface-2:#1a2427; --surface-3:#213033;
    --line:#253134; --line-strong:#3a4d51;
    --ink:#e8efed; --ink-2:#b6c5c3; --ink-3:#85989a; --ink-4:#6b7d7f;
    --accent:#3fb8a6; --accent-hover:#5cccbb; --accent-ink:#06201d;
    --accent-tint:#0f2b28; --accent-line:#1f4a45;
    --t-neutral:#93a4a6;   --t-neutral-bg:#1c2427;   --t-neutral-line:#2e3b3e;
    --t-active:#3fb8a6;    --t-active-bg:#0f2b28;    --t-active-line:#1f4a45;
    --t-attention:#dda75a; --t-attention-bg:#2b2010; --t-attention-line:#4a3a1b;
    --t-success:#59bd8a;   --t-success-bg:#10281d;   --t-success-line:#20452f;
    --t-critical:#e58179;  --t-critical-bg:#2d1614;  --t-critical-line:#4d2723;
    --meter-track:#26312f; --chart-grid:#1f2a2c;
    --shadow-pop:0 4px 12px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    --shadow-overlay:0 24px 48px -12px rgba(0,0,0,.7), 0 0 0 1px var(--line);
  }
}
/* dark, chosen explicitly — must win over a light OS */
:root[data-theme="dark"]{
  --ground:#0d1315; --surface:#141c1e; --surface-2:#1a2427; --surface-3:#213033;
  --line:#253134; --line-strong:#3a4d51;
  --ink:#e8efed; --ink-2:#b6c5c3; --ink-3:#85989a; --ink-4:#6b7d7f;
  --accent:#3fb8a6; --accent-hover:#5cccbb; --accent-ink:#06201d;
  --accent-tint:#0f2b28; --accent-line:#1f4a45;
  --t-neutral:#93a4a6;   --t-neutral-bg:#1c2427;   --t-neutral-line:#2e3b3e;
  --t-active:#3fb8a6;    --t-active-bg:#0f2b28;    --t-active-line:#1f4a45;
  --t-attention:#dda75a; --t-attention-bg:#2b2010; --t-attention-line:#4a3a1b;
  --t-success:#59bd8a;   --t-success-bg:#10281d;   --t-success-line:#20452f;
  --t-critical:#e58179;  --t-critical-bg:#2d1614;  --t-critical-line:#4d2723;
  --meter-track:#26312f; --chart-grid:#1f2a2c;
  --shadow-pop:0 4px 12px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-overlay:0 24px 48px -12px rgba(0,0,0,.7), 0 0 0 1px var(--line);
}

/* ---------------------------------------------------------------------------
   LAYER 2 · PRIMITIVES
--------------------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-ui); background:var(--ground); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:22px;line-height:1.25}
h2{font-size:17px;line-height:1.3}
h3{font-size:14px;line-height:1.35}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
ul,ol,dl,dd{margin:0;padding:0}
li{list-style:none}
svg{display:block}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.skip{position:absolute;left:-9999px;top:8px;z-index:300;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-control);padding:8px 14px;font-weight:600}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* type roles ---------------------------------------------------------------- */
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* ---------------------------------------------------------------------------
   LAYER 3 · COMPONENTS
--------------------------------------------------------------------------- */

/* --- app frame ------------------------------------------------------------ */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}

/* --- left rail ------------------------------------------------------------ */
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60}
.rail-head{padding:var(--s-4);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px}
.mark-glyph{width:28px;height:28px;flex:none;border-radius:var(--r-control);
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark-name{font-weight:600;font-size:14.5px;letter-spacing:-.02em}
.rail-ctx{margin-top:var(--s-3);padding:10px;border:1px solid var(--line);
  border-radius:var(--r-control);background:var(--surface-2)}
.rail-ctx .eyebrow{display:block;margin-bottom:3px}
.rail-ctx-name{font-weight:600;font-size:13px;line-height:1.3}
.rail-ctx-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.rail-nav{flex:1;overflow-y:auto;padding:var(--s-3) var(--s-2)}
.rail-group{padding:var(--s-3) 10px 5px}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 10px;border:0;border-radius:var(--r-control);background:transparent;
  color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
.rail-item:hover{background:var(--surface-2);color:var(--ink)}
.rail-item[aria-current="page"]{background:var(--accent-tint);color:var(--accent);font-weight:600}
.rail-item .gl{flex:none;width:16px;height:16px;opacity:.85}
.rail-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-item .tally{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);
  background:var(--surface-2);border-radius:var(--r-pill);padding:1px 7px}
.rail-item[aria-current="page"] .tally{background:var(--surface);color:var(--accent)}
.rail-foot{border-top:1px solid var(--line);padding:var(--s-3) var(--s-2)}

/* --- topbar --------------------------------------------------------------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-5)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);min-width:0}
.crumbs b{color:var(--ink-2);font-weight:600}
.crumbs .sep{opacity:.5}
.topbar-spacer{flex:1}
.topbar-tools{display:flex;align-items:center;gap:var(--s-2)}

.searchcue{display:flex;align-items:center;gap:var(--s-2);height:32px;padding:0 10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-control);
  color:var(--ink-3);font-size:12.5px;cursor:pointer;min-width:196px;
  transition:border-color var(--fast) var(--ease)}
.searchcue:hover{border-color:var(--line-strong)}
.searchcue .k{margin-left:auto}
.kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink-3);background:var(--surface)}

.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r-control);background:var(--surface);color:var(--ink-2);cursor:pointer;
  position:relative;transition:background var(--fast) var(--ease)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .ping{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 4px;
  border-radius:var(--r-pill);background:var(--t-critical);color:var(--surface);
  font-family:var(--font-mono);font-size:9.5px;line-height:15px;font-weight:600}
:root[data-theme="dark"] .iconbtn .ping,
:root:not([data-theme="light"]) .iconbtn .ping{color:var(--ground)}

.identity{display:flex;align-items:center;gap:var(--s-2);height:32px;padding:0 4px 0 8px;
  border:1px solid var(--line);border-radius:var(--r-control);background:var(--surface)}
.identity label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.identity select{border:0;background:transparent;font-size:12.5px;font-weight:600;
  padding:0 2px;cursor:pointer;max-width:190px}
.identity select:focus-visible{outline-offset:0}

/* --- main / view ---------------------------------------------------------- */
.main{display:flex;flex-direction:column;min-width:0}
.view{padding:var(--s-5) var(--s-5) var(--s-7);max-width:var(--view-max);width:100%;
  display:flex;flex-direction:column;gap:var(--s-4)}
.view-head{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap}
.view-head .titles{flex:1;min-width:260px;display:flex;flex-direction:column;gap:3px}
.view-head .sub{color:var(--ink-3);font-size:13px;max-width:78ch}
.view-actions{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}

/* --- panel ---------------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);
  display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head .titles{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.panel-head .sub{font-size:12.5px;color:var(--ink-3)}
.panel-body{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.panel-body.flush{padding:0}
.panel-foot{border-top:1px solid var(--line);padding:var(--s-3) var(--s-4);
  display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;background:var(--surface-2);
  border-radius:0 0 var(--r-panel) var(--r-panel)}

/* --- metric --------------------------------------------------------------- */
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);
  padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.metric .val{font-family:var(--font-mono);font-size:25px;font-weight:500;
  letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.metric .val .unit{font-size:14px;color:var(--ink-3);letter-spacing:0}
.metric .foot{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

/* --- table ---------------------------------------------------------------- */
.tablewrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{position:sticky;top:0;z-index:1;text-align:left;background:var(--surface-2);
  border-bottom:1px solid var(--line);padding:9px var(--s-4);white-space:nowrap;
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .arrow{opacity:0;margin-left:5px}
thead th[aria-sort] .arrow{opacity:1;color:var(--accent)}
tbody td{padding:11px var(--s-4);border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.tap{cursor:pointer}
tbody tr.tap:hover{background:var(--surface-2)}
td.right,th.right{text-align:right}
.cell-primary{font-weight:600;color:var(--ink)}
.cell-meta{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.rowactions{display:flex;gap:6px;justify-content:flex-end}

/* --- identifier ------------------------------------------------------------ */
.id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:0 5px}

/* --- status pill ---------------------------------------------------------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;
  border-radius:var(--r-pill);font-size:11.5px;font-weight:600;white-space:nowrap;
  border:1px solid var(--t-neutral-line);background:var(--t-neutral-bg);color:var(--t-neutral)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill[data-tone="active"]{border-color:var(--t-active-line);background:var(--t-active-bg);color:var(--t-active)}
.pill[data-tone="attention"]{border-color:var(--t-attention-line);background:var(--t-attention-bg);color:var(--t-attention)}
.pill[data-tone="success"]{border-color:var(--t-success-line);background:var(--t-success-bg);color:var(--t-success)}
.pill[data-tone="critical"]{border-color:var(--t-critical-line);background:var(--t-critical-bg);color:var(--t-critical)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-control);
  border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--ink-2)}

/* --- buttons -------------------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:32px;padding:0 13px;border-radius:var(--r-control);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn[data-variant="primary"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[data-variant="primary"]:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn[data-variant="success"]{background:var(--t-success);border-color:var(--t-success);color:var(--surface)}
:root[data-theme="dark"] .btn[data-variant="success"],
:root:not([data-theme="light"]) .btn[data-variant="success"]{color:var(--ground)}
.btn[data-variant="success"]:hover{filter:brightness(1.08)}
.btn[data-variant="danger"]{color:var(--t-critical);border-color:var(--t-critical-line);background:var(--surface)}
.btn[data-variant="danger"]:hover{background:var(--t-critical-bg)}
.btn[data-variant="quiet"]{border-color:transparent;background:transparent;color:var(--accent);padding:0 9px}
.btn[data-variant="quiet"]:hover{background:var(--accent-tint)}
.btn[data-size="sm"]{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:var(--s-2);flex-wrap:wrap}

/* --- fields --------------------------------------------------------------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .req{color:var(--t-critical);margin-left:2px}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.field .err{font-size:11.5px;color:var(--t-critical);font-weight:500;display:none}
.field[data-invalid] .err{display:block}
.input,.select,.textarea{width:100%;min-height:32px;padding:6px 10px;border:1px solid var(--line-strong);
  border-radius:var(--r-control);background:var(--surface);color:var(--ink);
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.textarea{min-height:78px;resize:vertical;line-height:1.5}
.input:hover,.select:hover,.textarea:hover{border-color:var(--ink-4)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-tint)}
.field[data-invalid] .input,.field[data-invalid] .select,.field[data-invalid] .textarea{border-color:var(--t-critical)}
.input::placeholder,.textarea::placeholder{color:var(--ink-4)}
.checkline{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border:1px solid var(--line);
  border-radius:var(--r-control);cursor:pointer;background:var(--surface);font-size:13px}
.checkline:hover{background:var(--surface-2)}
.checkline input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.checkline .cl-sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-4)}
.formgrid .span{grid-column:1/-1}

/* --- tabs ----------------------------------------------------------------- */
[role="tablist"]{display:flex;gap:var(--s-1);border-bottom:1px solid var(--line);
  padding:0 var(--s-4);overflow-x:auto}
[role="tab"]{border:0;background:transparent;padding:11px 10px 9px;font-size:13px;font-weight:600;
  color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
[role="tab"]:hover{color:var(--ink)}
[role="tab"][aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* --- description list ----------------------------------------------------- */
.dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:10px var(--s-4);font-size:13px}
.dl dt{color:var(--ink-3);font-size:12.5px;font-weight:500}
.dl dd{color:var(--ink-2)}

/* --- meter ---------------------------------------------------------------- */
.meter{height:5px;border-radius:var(--r-pill);background:var(--meter-track);overflow:hidden}
.meter > i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);
  transition:width var(--base) var(--ease)}
.meter[data-tone="success"] > i{background:var(--t-success)}
.meter[data-tone="attention"] > i{background:var(--t-attention)}

/* --- stage rail (lifecycle) ----------------------------------------------- */
.stagerail{display:flex;overflow-x:auto;padding:var(--s-2) 0 var(--s-1);gap:0}
.stage{flex:1;min-width:112px;position:relative;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:7px;padding:0 4px}
.stage .track{position:absolute;top:11px;right:50%;width:100%;height:2px;background:var(--line)}
.stage:first-child .track{display:none}
.stage[data-state="done"] .track,.stage[data-state="here"] .track{background:var(--accent)}
.stage .node{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);
  font-family:var(--font-mono);font-size:11px;color:var(--ink-4)}
.stage[data-state="done"] .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage[data-state="here"] .node{border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-tint)}
.stage .name{font-size:11.5px;font-weight:600;color:var(--ink-4);line-height:1.25}
.stage[data-state="done"] .name,.stage[data-state="here"] .name{color:var(--ink-2)}
.stage .when{font-family:var(--font-mono);font-size:10px;color:var(--ink-4)}

/* --- activity timeline ---------------------------------------------------- */
.timeline{display:flex;flex-direction:column}
.event{display:grid;grid-template-columns:22px minmax(0,1fr);gap:var(--s-3);
  padding-bottom:var(--s-4);position:relative}
.event:last-child{padding-bottom:0}
.event .spine{position:absolute;left:10px;top:20px;bottom:0;width:1px;background:var(--line)}
.event:last-child .spine{display:none}
.event .dot{width:20px;height:20px;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:10px;z-index:1}
.event .what{font-size:13px;color:var(--ink)}
.event .who{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap}

/* --- assets (simulated captured media) ------------------------------------ */
.assetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:var(--s-2)}
.asset{aspect-ratio:4/3;border:1px solid var(--line);border-radius:var(--r-control);
  background:var(--surface-2);display:grid;place-items:center;color:var(--ink-4);position:relative}
.asset .tag{position:absolute;bottom:3px;left:3px;font-family:var(--font-mono);
  font-size:9px;color:var(--ink-3);background:var(--surface);border-radius:2px;padding:0 3px}

/* --- empty / skeleton ----------------------------------------------------- */
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);
  padding:var(--s-7) var(--s-4);text-align:center}
.empty .glyph{width:40px;height:40px;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-4)}
.empty .title{font-weight:600}
.empty .body{font-size:13px;color:var(--ink-3);max-width:46ch}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shimmer 1.3s linear infinite;border-radius:3px;height:11px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* --- callout -------------------------------------------------------------- */
.callout{border:1px solid var(--t-active-line);background:var(--t-active-bg);color:var(--t-active);
  border-radius:var(--r-control);padding:10px 12px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.callout[data-tone="attention"]{border-color:var(--t-attention-line);background:var(--t-attention-bg);color:var(--t-attention)}
.callout[data-tone="critical"]{border-color:var(--t-critical-line);background:var(--t-critical-bg);color:var(--t-critical)}
.callout .ct{font-weight:600;display:block;margin-bottom:2px}

/* --- overlay: dialog & palette -------------------------------------------- */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(9,17,18,.5);
  display:none;justify-content:center;padding:var(--s-6) var(--s-4);overflow-y:auto}
.overlay[data-open]{display:flex}
.overlay[data-align="top"]{align-items:flex-start;padding-top:11vh}
.dialog{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--shadow-overlay);
  width:100%;max-width:640px;align-self:flex-start;animation:rise var(--base) var(--ease)}
.dialog[data-size="wide"]{max-width:980px}
@keyframes rise{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.dialog-head{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-4);
  border-bottom:1px solid var(--line)}
.dialog-head .titles{flex:1;display:flex;flex-direction:column;gap:2px}
.dialog-head .sub{font-size:12.5px;color:var(--ink-3)}
.dialog-body{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-4);
  max-height:64vh;overflow-y:auto}
.dialog-foot{display:flex;gap:var(--s-2);justify-content:flex-end;padding:var(--s-3) var(--s-4);
  border-top:1px solid var(--line);background:var(--surface-2);
  border-radius:0 0 var(--r-panel) var(--r-panel);flex-wrap:wrap}

.palette{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--shadow-overlay);
  width:100%;max-width:560px;align-self:flex-start;overflow:hidden;animation:rise var(--base) var(--ease)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px var(--s-4);
  font-size:15px;background:transparent}
.palette input:focus{outline:none}
.palette ul{max-height:340px;overflow-y:auto;padding:var(--s-2)}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-control);
  cursor:pointer;font-size:13px}
.palette li[data-active]{background:var(--accent-tint);color:var(--accent)}
.palette li .where{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}
.palette li[data-active] .where{color:var(--accent)}
.palette .pfoot{border-top:1px solid var(--line);padding:8px var(--s-4);font-size:11.5px;
  color:var(--ink-3);display:flex;gap:var(--s-3);background:var(--surface-2)}

/* --- popover menu --------------------------------------------------------- */
.pop{position:absolute;top:calc(100% + 6px);right:0;z-index:70;width:320px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow-pop);overflow:hidden}
.pop-head{padding:10px var(--s-3);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s-2)}
.pop-list{max-height:320px;overflow-y:auto}
.pop-item{display:flex;gap:10px;padding:10px var(--s-3);border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;cursor:pointer}
.pop-item:last-child{border-bottom:0}
.pop-item:hover{background:var(--surface-2)}
.pop-item .txt{font-size:12.5px;line-height:1.4}
.pop-item .ts{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.hostrel{position:relative}

/* --- toasts --------------------------------------------------------------- */
.toasts{position:fixed;right:var(--s-5);bottom:var(--s-5);z-index:250;
  display:flex;flex-direction:column;gap:var(--s-2);max-width:min(400px,calc(100vw - 48px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-control);
  padding:11px 13px;box-shadow:var(--shadow-pop);animation:slidein var(--base) var(--ease)}
.toast[data-tone="success"]{border-left-color:var(--t-success)}
.toast[data-tone="critical"]{border-left-color:var(--t-critical)}
.toast .tt{font-size:13px;font-weight:600}
.toast .tb{font-size:12px;color:var(--ink-3);margin-top:1px}
@keyframes slidein{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}

/* --- design-system reference page ----------------------------------------- */
.swatchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:var(--s-3)}
.swatch{border:1px solid var(--line);border-radius:var(--r-control);overflow:hidden}
.swatch .chipc{height:52px}
.swatch .meta{padding:7px 9px;font-size:11px;border-top:1px solid var(--line)}
.swatch .meta b{display:block;font-size:12px;font-weight:600}
.swatch .meta code{font-family:var(--font-mono);color:var(--ink-3);font-size:10.5px}
.specrow{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-3) 0;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.specrow:last-child{border-bottom:0}
.specrow .demo{flex:1;min-width:220px;display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap}
.specrow .note{width:280px;font-size:12px;color:var(--ink-3)}
.specrow .note b{color:var(--ink-2);display:block;font-size:12.5px}

/* ---------------------------------------------------------------------------
   LAYER 4 · UTILITIES
--------------------------------------------------------------------------- */
.row{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap}
.row.tight{gap:var(--s-2)}
.col{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.grid{display:grid;gap:var(--s-4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.push{margin-left:auto}
.divide{height:1px;background:var(--line)}

/* ---------------------------------------------------------------------------
   RESPONSIVE — rail: full (>1180) → icons (841–1180) → drawer (<=840)
--------------------------------------------------------------------------- */
@media (max-width:1240px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1180px){
  .app{grid-template-columns:var(--rail-w-min) minmax(0,1fr)}
  .rail-head{padding:var(--s-3) 10px}
  .mark-name,.rail-ctx,.rail-group,.rail-item .lbl,.rail-item .tally{display:none}
  .rail-item{justify-content:center;padding:9px 0}
  .searchcue{min-width:0}
  .searchcue .lbl,.searchcue .k{display:none}
}
@media (max-width:980px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formgrid{grid-template-columns:minmax(0,1fr)}
  .identity label{display:none}
}
@media (max-width:840px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;width:var(--rail-w);transform:translateX(-100%);
    transition:transform var(--base) var(--ease);box-shadow:var(--shadow-overlay)}
  .rail[data-open]{transform:none}
  .rail-head{padding:var(--s-4)}
  .mark-name,.rail-ctx,.rail-group,.rail-item .lbl,.rail-item .tally{display:revert}
  .rail-item{justify-content:flex-start;padding:7px 10px}
  .view{padding:var(--s-4) var(--s-4) var(--s-6)}
  .topbar{padding:0 var(--s-4)}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .dl{grid-template-columns:minmax(0,1fr)}
  .dl dt{margin-top:var(--s-2)}
  .scrim{position:fixed;inset:0;background:rgba(9,17,18,.5);z-index:55}
}
@media (min-width:841px){ .railtoggle,.scrim{display:none} }
</style>

   The UI asks can('rfp.create') rather than checking the role directly, so a
   new role is a row in this table rather than a hunt through the views.

const CAPS = {
  client:     ['rfp.create','rfp.publish','rfp.read','proposal.read','proposal.accept',
               'contract.read','contract.approve','delivery.track','invoice.read','rating.write'],
  tenant:     ['rfp.read.published','proposal.create','contract.read','contract.deliver',
               'task.create','task.assign','qa.review','network.manage','equipment.read','invoice.read','rating.write'],
  aggregator: ['task.read','task.start','task.submit','roster.manage','equipment.request'],
  business:   ['task.read','task.start','task.submit','profile.manage','equipment.request'],
  sponsor:    ['equipment.manage','equipment.decide'],
  admin:      ['account.read','billing.read','activity.read']
};
const can = cap => CAPS[state.session.role].includes(cap);

const $  = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id) => arr.find(x => x.id === id);
const money = n => '$' + Number(n||0).toLocaleString('en-US');
const compact = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(n);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){
  if (!iso) return '—';
  const [y,m,d] = iso.slice(0,10).split('-');
  return Number(d) + ' ' + MONTHS[Number(m)-1] + ' ' + y;
}
function fmtWhen(iso){
  if (!iso) return '—';
  const t = iso.length > 10 ? ' · ' + iso.slice(11,16) : '';
  return fmtDate(iso) + t;
}
const TODAY = '2026-08-29';
const nid = (prefix,key) => prefix + '-' + String(++state.seq[key]).padStart(2,'0');

/* entity lookups */
const client  = id => byId(state.clients,id)        || {name:'Unknown client'};
const tenant  = id => byId(state.tenants,id)        || {name:'Unknown tenant'};
const agg     = id => byId(state.aggregators,id)    || {name:'Unknown aggregator'};
const biz     = id => byId(state.businesses,id)     || {name:'Unknown business'};
const sponsor = id => byId(state.deviceSponsors,id) || {name:'Unknown sponsor'};
const rfpOf   = id => byId(state.rfps,id)           || {title:'Unknown request', spec:{}, people:{}, timeline:{}};
const supplier = t => t.assigneeType === 'aggregator' ? agg(t.assigneeId) : biz(t.assigneeId);
function findDevice(deviceId){
  for (const s of state.deviceSponsors){
    const d = s.devices.find(x => x.id === deviceId);
    if (d) return { device:d, sponsor:s };
  }
  return { device:null, sponsor:null };
}
const deviceName = id => (findDevice(id).device || {}).type || id;

/* the organisation currently signed in */
function me(){
  const list = ROLES[state.session.role].accounts();
  return byId(list, state.session.orgId) || list[0] || { id:'?', name:'—' };
}
const myContracts = () => state.contracts.filter(c => c.tenantId === state.session.orgId);
const myContractIds = () => myContracts().map(c => c.id);

/* contract completion, derived from its tasks */
function progressOf(contractId){
  const tasks = state.tasks.filter(t => t.contractId === contractId);
  const done  = tasks.filter(t => t.status === 'QA Passed').length;
  return { tasks, done, total:tasks.length, pct: tasks.length ? Math.round(done/tasks.length*100) : 0 };
}
/* a contract can be handed to the client once every task has cleared QA */
const deliverable = c => ['Active','In QA'].includes(c.status) &&
  progressOf(c.id).total > 0 && progressOf(c.id).done === progressOf(c.id).total;

/* the lifecycle rail — the product's signature component */
function stageRail(current, marks={}){
  const at = LIFECYCLE.indexOf(current);
  return `<div class="stagerail">${LIFECYCLE.map((s,i) => {
    const st = i < at ? 'done' : i === at ? 'here' : 'todo';
    return `<div class="stage" data-state="${st}">

      <span class="node">${i < at ? icon('check',12) : i+1}</span>

/* --- data table with client-side sorting ---------------------------------- */
function sortState(id){ return state.session.sort[id] || {}; }
function sortTable(id, key){
  const cur = sortState(id);
  state.session.sort[id] = { key, dir: cur.key === key && cur.dir === 'asc' ? 'desc' : 'asc' };
  render();
}
function dataTable({ id, cols, items, row, empty, onRow }){
  const s = sortState(id);
  let list = items.slice();
  const col = cols.find(c => c.key === s.key);
  if (col && col.sort){
    list.sort((a,b) => {
      const av = col.sort(a), bv = col.sort(b);
      const r = typeof av === 'number' ? av - bv : String(av).localeCompare(String(bv));
      return s.dir === 'desc' ? -r : r;
    });
  }
  const head = cols.map(c => {
    const active = s.key === c.key;
    const cls = [c.align === 'right' ? 'right' : '', c.sort ? 'sortable' : ''].filter(Boolean).join(' ');
    const sortAttrs = c.sort
      ? ` onclick="sortTable('${id}','${c.key}')" tabindex="0"` +
        ` onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();sortTable('${id}','${c.key}')}"`
      : '';
    return `<th${cls ? ` class="${cls}"` : ''}` +
      `${active ? ` aria-sort="${s.dir === 'asc' ? 'ascending' : 'descending'}"` : ''}` +
      `${sortAttrs}${c.width ? ` style="width:${c.width}"` : ''}>` +
      `${esc(c.label)}${c.sort ? `<span class="arrow">${active && s.dir === 'desc' ? '\u2193' : '\u2191'}</span>` : ''}</th>`;
  }).join('');
  const body = list.length
    ? list.map(item => `<tr${onRow ? ` class="tap" onclick="${onRow(item)}"` : ''}>${row(item).map(cell =>
        typeof cell === 'string' ? `<td>${cell}</td>` : `<td class="${cell.cls||''}">${cell.html}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length}">${emptyState(empty)}</td></tr>`;
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* --- form fields ----------------------------------------------------------- */
function field({ id, label, type='text', value='', placeholder='', required, hint, options, rows, span, suffix }){
  const ctl = type === 'select'
    ? `<select class="select" id="${id}">${options.map(o =>
        `<option value="${esc(o)}"${String(o)===String(value)?' selected':''}>${esc(o)}</option>`).join('')}</select>`
    : type === 'textarea'
    ? `<textarea class="textarea" id="${id}" placeholder="${esc(placeholder)}"${rows?` rows="${rows}"`:''}>${esc(value)}</textarea>`
    : `<input class="input" id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}">`;
  return `<div class="field${span ? ' span' : ''}" id="fw_${id}">
    <label for="${id}">${esc(label)}${required ? '<span class="req" aria-hidden="true">*</span>' : ''}</label>
    ${ctl}${suffix || ''}
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ''}
    <span class="err" id="err_${id}"></span>
  </div>`;
}
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
function invalid(id, msg){
  const w = document.getElementById('fw_' + id), e = document.getElementById('err_' + id);
  if (w){ w.setAttribute('data-invalid',''); }
  if (e){ e.textContent = msg; }
  const f = document.getElementById(id); if (f) f.focus();
  return false;
}
function clearInvalid(ids){ ids.forEach(id => {
  const w = document.getElementById('fw_' + id); if (w) w.removeAttribute('data-invalid');
}); }

/* --- multi-step request builder ------------------------------------------- */
let draft = blankDraft();
function blankDraft(){
  return { step:1, title:'', category:'Image', geography:'', compliance:'',
    format:'', quantity:'', quality:'', acceptance:'',
    headcount:'', training:'', experience:'', certification:'',
    budgetMin:'', budgetMax:'', start:'', delivery:'' };
}
const STEPS = [
  { n:1, name:'Basics',        ids:['d_title','d_category','d_geography','d_compliance'] },
  { n:2, name:'Specification', ids:['d_format','d_quantity','d_quality','d_acceptance'] },
  { n:3, name:'People',        ids:['d_headcount','d_certification','d_training','d_experience'] },
  { n:4, name:'Commercials',   ids:['d_budgetMin','d_budgetMax','d_start','d_delivery'] },
  { n:5, name:'Review',        ids:[] }
];
function captureStep(){
  STEPS.forEach(s => s.ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) draft[id.slice(2)] = el.value.trim();
  }));
}
function stepNav(dir){
  captureStep();
  if (dir > 0){
    const s = draft.step;
    if (s === 1 && !draft.title) return invalid('d_title','Give the request a title so partners can identify it.');
    if (s === 2 && !draft.quantity) return invalid('d_quantity','State how much data you need — partners price against volume.');
    if (s === 4){
      const lo = Number(draft.budgetMin), hi = Number(draft.budgetMax);
      if (lo && hi && hi < lo) return invalid('d_budgetMax','The maximum must be at least the minimum.');
      if (draft.start && draft.delivery && draft.delivery < draft.start)
        return invalid('d_delivery','The delivery date must fall after the start date.');
    }
  }
  draft.step = Math.min(5, Math.max(1, draft.step + dir));
  render();
}

      ['Certification', esc(draft.certification || '—')],
      ['Budget', (draft.budgetMin || draft.budgetMax) ? `${money(draft.budgetMin)} – ${money(draft.budgetMax)}` : '—'],
      ['Timeline', `${draft.start ? fmtDate(draft.start) : '—'} → ${draft.delivery ? fmtDate(draft.delivery) : '—'}`],
      ['Compliance', esc(draft.compliance || '—')]
    ]);

  const foot = `${s > 1 ? `<button class="btn" onclick="stepNav(-1)">${icon('back',13)} Back</button>` : ''}
    <span class="push"></span>
    ${s < 5 ? `<button class="btn" data-variant="primary" onclick="stepNav(1)">Continue ${icon('arrow',13)}</button>`
      : `<button class="btn" onclick="saveRequest(false)">Save as draft</button>
         <button class="btn" data-variant="primary" onclick="saveRequest(true)">${icon('send',13)} Publish to partners</button>`}`;

  return viewHead({ title:'New request', sub:`Step ${s} of 5 — ${STEPS[s-1].name}` })
    + panel({ body: rail + body, foot });
};

        { cls:'right num', html:`${p.days}d${p.days === fast && props.length > 1 ? ' <span class="pill" data-tone="active">fastest</span>' : ''}` },
        { cls:'right num', html:`${t.qaPass}% QA` },

      ${panel({ title:'People, budget and timeline', body: dl([

        ['Start', `<span class="num">${fmtDate(r.timeline.start)}</span>`],

function taskTable(contractId, tasks){
  return dataTable({ id:'tn-tasks-' + contractId,
    cols:[{key:'t',label:'Task',sort:t=>t.title},{key:'w',label:'Assigned to'},{key:'e',label:'Equipment'},
          {key:'s',label:'Status'},{key:'a',label:'Assets',align:'right',sort:t=>t.assets},
          {key:'d',label:'Due',align:'right',sort:t=>t.due},{key:'x',label:'',align:'right'}],
    items: tasks,
    row: t => [
      `<div class="cell-primary">${esc(t.title)}</div><div class="cell-meta">${idTag(t.id)} target ${esc(t.target)}</div>`,
      `<span class="chip">${t.assigneeType === 'aggregator' ? 'Aggregator' : 'Business'}</span> ${esc(supplier(t).name)}`,
      t.deviceIds.length ? t.deviceIds.map(d => `<span class="chip">${icon('camera',12)} ${esc(deviceName(d))}</span>`).join(' ')
        : '<span class="muted small">—</span>',
      pill(t.status),
      { cls:'right num', html:String(t.assets) },
      { cls:'right num', html:fmtDate(t.due) },
      { cls:'right', html: t.status === 'Submitted' && can('qa.review')

/* ---------------------------------------------------------------------------
   §8 ACTIONS — every mutation. Each one writes to the audit trail, notifies
   the party whose turn it now is, gives feedback, and re-renders.
--------------------------------------------------------------------------- */

/* --- client: publish and create ------------------------------------------ */
function publishRequest(id){
  const r = rfpOf(id);
  r.status = 'Published';
  log(`Published ${r.id}, ${r.title}`, [r.id, r.clientId]);
  state.tenants.forEach(t => notify('tenant', t.id, `${r.title} is open for proposals.`, 'opportunities'));
  toast('Request published', `${state.tenants.length} delivery partners can now bid on ${r.id}.`, 'success');
  render();
}
function saveRequest(publish){
  captureStep();
  if (!draft.title) { draft.step = 1; render(); return invalid('d_title','Give the request a title so partners can identify it.'); }
  const r = {
    id: nid('RFP','rfp'), clientId: me().id, title: draft.title, category: draft.category,
    spec:{ format: draft.format || 'To be agreed', quantity: draft.quantity || 'To be agreed',
           quality: draft.quality || 'Standard acceptance applies' },
    people:{ headcount: Number(draft.headcount) || 0, training: draft.training || 'None specified',
             experience: draft.experience || 'None specified', certification: draft.certification || 'None' },
    geography: draft.geography || 'Not specified',
    budgetMin: Number(draft.budgetMin) || 0, budgetMax: Number(draft.budgetMax) || 0,
    timeline:{ start: draft.start || TODAY, delivery: draft.delivery || TODAY },
    acceptance: draft.acceptance || 'Client review on delivery',
    compliance: draft.compliance || 'None specified',
    status: publish ? 'Published' : 'Draft', createdAt: TODAY
  };
  state.rfps.unshift(r);
  log(`${publish ? 'Published' : 'Drafted'} ${r.id}, ${r.title}`, [r.id, r.clientId]);
  if (publish) state.tenants.forEach(t => notify('tenant', t.id, `${r.title} is open for proposals.`, 'opportunities'));
  draft = blankDraft();
  toast(publish ? 'Request published' : 'Saved as draft',
    publish ? 'Delivery partners can start bidding now.' : 'Publish it when you are ready for proposals.', 'success');
  go('requestDetail', { id:r.id });
}

/* --- tenant: briefs and proposals ---------------------------------------- */
function viewBrief(id){
  const r = rfpOf(id);
  const already = state.proposals.some(p => p.rfpId === r.id && p.tenantId === me().id);
  openDialog({ title:r.title, sub:`${r.id} · ${client(r.clientId).name} · ${r.category}`, size:'wide',
    body:`<div class="grid g2">
      ${dl([ ['Format', esc(r.spec.format)], ['Quantity', esc(r.spec.quantity)], ['Quality bar', esc(r.spec.quality)],
             ['Acceptance', esc(r.acceptance)], ['Geography', esc(r.geography)], ['Compliance', esc(r.compliance)] ])}
      ${dl([ ['Headcount', `<span class="num">${r.people.headcount}</span>`], ['Training', esc(r.people.training)],
             ['Experience', esc(r.people.experience)], ['Certification', esc(r.people.certification)],
             ['Budget', `<span class="num">${money(r.budgetMin)} – ${money(r.budgetMax)}</span>`],
             ['Window', `<span class="num">${fmtDate(r.timeline.start)} → ${fmtDate(r.timeline.delivery)}</span>`] ])}
    </div>`,
    foot:`<button class="btn" onclick="closeDialog()">Close</button>
      ${['Published','Proposals Received'].includes(r.status) && !already
        ? `<button class="btn" data-variant="primary" onclick="proposalForm('${r.id}')">Submit a proposal</button>` : ''}` });
}
function proposalForm(rfpId){
  const r = rfpOf(rfpId);
  openDialog({ title:'Submit a proposal', sub:`${r.title} · client budget ${money(r.budgetMin)} – ${money(r.budgetMax)}`,
    body:`<div class="formgrid">
        ${field({ id:'p_price', label:'Your price (USD)', type:'number', required:true, placeholder:String(r.budgetMax || 50000) })}
        ${field({ id:'p_days', label:'Delivery timeline (days)', type:'number', required:true, placeholder:'60' })}
        ${field({ id:'p_method', label:'Methodology', type:'textarea', required:true, span:true,
          placeholder:'Which aggregators, business partners and equipment you will use, and how QA works.',
          hint:'Clients compare on method as much as price — name the parts of your network you will deploy.' })}
        ${field({ id:'p_notes', label:'Notes to the client', type:'textarea', span:true,
          placeholder:'Assumptions, dependencies, earliest start date' })}
      </div>`,
    foot:`<button class="btn" onclick="closeDialog()">Cancel</button>
      <button class="btn" data-variant="primary" onclick="submitProposal('${rfpId}')">${icon('send',13)} Submit proposal</button>` });
}
function submitProposal(rfpId){
  clearInvalid(['p_price','p_days','p_method']);
  const price = Number(val('p_price')), days = Number(val('p_days')), method = val('p_method');
  const r = rfpOf(rfpId);
  if (!price) return invalid('p_price','Enter the price you are bidding.');
  if (!days)  return invalid('p_days','Enter how many days delivery will take.');
  if (!method) return invalid('p_method','Describe how you will deliver this — clients reject bids without a method.');
  const p = { id:nid('PRO','pro'), rfpId, tenantId:me().id, price, days, methodology:method,
              notes:val('p_notes'), status:'Submitted', submittedAt:TODAY };
  state.proposals.push(p);
  if (r.status === 'Published') r.status = 'Proposals Received';
  log(`Submitted proposal ${p.id} against ${r.id}`, [r.id, p.id, me().id, r.clientId]);
  notify('client', r.clientId, `${me().name} submitted a proposal on ${r.title}.`, 'requestDetail', { id:r.id });
  closeDialog();
  toast('Proposal submitted', `${client(r.clientId).name} has been notified.`, 'success');
  go('proposals');
}
function viewProposal(id){
  const p = byId(state.proposals, id), r = rfpOf(p.rfpId), t = tenant(p.tenantId);
  openDialog({ title:`Proposal ${p.id}`, sub:r.title,
    body: dl([ ['Delivery partner', `${esc(t.name)} <span class="small muted">${esc(t.hq || '')}</span>`],
      ['Price', `<span class="num">${money(p.price)}</span>`],
      ['Timeline', `<span class="num">${p.days}</span> days`],
      ['Track record', t.qaPass ? `<span class="num">${t.qaPass}%</span> QA pass · <span class="num">${t.onTime}%</span> on time` : '—'],
      ['Status', pill(p.status)], ['Submitted', fmtDate(p.submittedAt)],
      ['Methodology', esc(p.methodology)], ['Notes', esc(p.notes || '—')] ]),
    foot:`<button class="btn" onclick="closeDialog()">Close</button>
      ${state.session.role === 'client' && p.status === 'Submitted' && !state.contracts.some(c => c.rfpId === p.rfpId)
        ? `<button class="btn" data-variant="primary" onclick="acceptProposal('${p.id}')">Award this proposal</button>` : ''}` });
}

/* --- client: award ------------------------------------------------------- */
function acceptProposal(propId){
  const p = byId(state.proposals, propId), r = rfpOf(p.rfpId);
  const others = state.proposals.filter(x => x.rfpId === p.rfpId && x.id !== p.id && x.status === 'Submitted');
  openDialog({ title:'Award this contract', sub:`${tenant(p.tenantId).name} · ${money(p.price)} · ${p.days} days`,
    body: callout('attention','This closes the request to other bidders',
      `${others.length} other ${others.length === 1 ? 'proposal is' : 'proposals are'} still open and will be declined automatically.`)
      + dl([ ['Request', esc(r.title)], ['Contract value', `<span class="num">${money(p.price)}</span>`],
             ['Delivery window', `<span class="num">${p.days}</span> days from award`],
             ['First invoice', `<span class="num">${money(Math.round(p.price*0.5))}</span> — milestone 1 of 2`] ]),
    foot:`<button class="btn" onclick="closeDialog()">Cancel</button>
      <button class="btn" data-variant="primary" onclick="confirmAward('${propId}')">Award and open the contract</button>` });
}
function confirmAward(propId){
  const p = byId(state.proposals, propId), r = rfpOf(p.rfpId);
  p.status = 'Accepted';
  state.proposals.filter(x => x.rfpId === p.rfpId && x.id !== p.id && x.status === 'Submitted')
    .forEach(x => { x.status = 'Rejected'; notify('tenant', x.tenantId, `${r.title} was awarded to another partner.`, 'proposals'); });
  const c = { id:nid('CTR','ctr'), rfpId:p.rfpId, tenantId:p.tenantId, proposalId:p.id,
              value:p.price, status:'Active', startedAt:TODAY, deliveredAt:null, completedAt:null };
  state.contracts.push(c);
  r.status = 'Accepted';
  state.invoices.push({ id:nid('INV','inv'), party:r.clientId, contractId:c.id,
    amount:Math.round(p.price*0.5), status:'Pending', kind:'Milestone 1 of 2', issued:TODAY });
  log(`Awarded ${c.id} to ${tenant(p.tenantId).name} for ${money(p.price)}`, [c.id, r.id, r.clientId, p.tenantId]);
  notify('tenant', p.tenantId, `You won ${r.title}. Break the contract into tasks to begin.`, 'contracts');
  closeDialog();
  toast('Contract awarded', `${c.id} is open with ${tenant(p.tenantId).name}.`, 'success');
  go('deliveryDetail', { id:c.id });
}

/* --- tenant: assign work ------------------------------------------------- */
function assignTaskForm(contractId){
  const c = byId(state.contracts, contractId);
  const aggs = state.aggregators.filter(a => a.tenantId === c.tenantId);
  const bzs  = state.businesses.filter(b => b.tenantId === c.tenantId);
  const devs = state.deviceSponsors.filter(s => s.tenantId === c.tenantId)
    .flatMap(s => s.devices.map(d => ({ ...d, sponsorName:s.name })));
  const r = rfpOf(c.rfpId);

  openDialog({ title:'Assign a task', sub:`${r.title} · ${c.id}`,
    body:`<div class="formgrid">
        ${field({ id:'t_title', label:'Task title', required:true, span:true, placeholder:'Kraków and Warsaw routes' })}
        ${field({ id:'t_target', label:'Target volume', placeholder:'300 hours · 5,000 images' })}
        ${field({ id:'t_due', label:'Due date', type:'date', value:r.timeline.delivery })}
      </div>
      <div class="field">
        <label for="t_assignee">Assign to<span class="req" aria-hidden="true">*</span></label>
        <select class="select" id="t_assignee">
          ${aggs.length ? `<optgroup label="Aggregators">${aggs.map(a =>
            `<option value="aggregator:${a.id}">${esc(a.name)} — ${a.crowdSize.toLocaleString()} crowd workers</option>`).join('')}</optgroup>` : ''}
          ${bzs.length ? `<optgroup label="Business partners">${bzs.map(b =>
            `<option value="business:${b.id}">${esc(b.name)} — ${esc(b.specialty)}</option>`).join('')}</optgroup>` : ''}
        </select>
        <span class="hint">Only partners in your own network appear here.</span>
      </div>
      <div class="field">
        <label>Attach equipment</label>
        <div class="col" style="gap:6px">${devs.length ? devs.map(d =>
          `<label class="checkline"><input type="checkbox" class="t_dev" value="${d.id}">
            <span>${esc(d.type)}<span class="cl-sub">${esc(d.sponsorName)} · ${d.qty} units · ${d.status}</span></span></label>`).join('')
          : '<span class="small muted">No device sponsors registered in your network yet.</span>'}</div>
        <span class="hint">Equipment is drawn from your registered device sponsors and released on their approval.</span>
      </div>`,
    foot:`<button class="btn" onclick="closeDialog()">Cancel</button>
      <button class="btn" data-variant="primary" onclick="createTask('${contractId}')">Assign task</button>` });

function createTask(contractId){
  clearInvalid(['t_title']);
  const title = val('t_title');
  if (!title) return invalid('t_title','Name the task so the supplier knows what to deliver.');
  const sel = document.getElementById('t_assignee');
  if (!sel || !sel.value) { toast('No supplier available', 'Add an aggregator or business partner to your network first.', 'critical'); return; }
  const [type, id] = sel.value.split(':');
  const deviceIds = Array.from(document.querySelectorAll('.t_dev:checked')).map(x => x.value);
  const c = byId(state.contracts, contractId), r = rfpOf(c.rfpId);
  const t = { id:nid('TSK','tsk'), contractId, title, target: val('t_target') || 'To be agreed',
              assigneeType:type, assigneeId:id, deviceIds, status:'Assigned', assets:0,
              due: val('t_due') || r.timeline.delivery, note:'' };
  state.tasks.push(t);
  if (r.status === 'Accepted') r.status = 'In Progress';
  log(`Assigned ${t.id} to ${supplier(t).name}`, [t.id, c.id, r.id, me().id, id]);
  notify(type, id, `${t.title} was assigned to you by ${me().name}.`, 'tasks');

  render();

function qaDecide(taskId, pass){
  const t = byId(state.tasks, taskId);
  const note = val('q_note');
  if (!pass && !note) return invalid('q_note','Say what must change — the supplier cannot act on a blank rejection.');
  t.status = pass ? 'QA Passed' : 'QA Failed';
  if (note) t.note = note;
  log(`${pass ? 'Passed' : 'Failed'} QA on ${t.id}${note ? ` — ${note}` : ''}`, [t.id, t.contractId, me().id, t.assigneeId]);
  notify(t.assigneeType, t.assigneeId, pass ? `${t.title} cleared QA.` : `${t.title} was sent back: ${note}`, 'tasks');
  closeDialog();
  toast(pass ? 'QA passed' : 'Sent back for rework',
    pass ? 'Ready to include in the client delivery.' : `${supplier(t).name} has been notified.`, pass ? 'success' : 'critical');
  render();
}

function removePartner(kind, id){

  const openWork = kind === 'sponsor' ? 0
    : state.tasks.filter(t => t.assigneeType === kind && t.assigneeId === id && t.status !== 'QA Passed').length;
  openDialog({ title:`Remove ${entity.name}?`, sub:'They lose access to your contracts immediately.',

function confirmRemovePartner(kind, id){
  const key = { aggregator:'aggregators', business:'businesses', sponsor:'deviceSponsors' }[kind];

function addDevice(){
  clearInvalid(['d_type']);
  const type = val('d_type');
  if (!type) return invalid('d_type','Name the equipment type.');
  me().devices.push({ id:nid('DV','dv'), type, qty:Number(val('d_qty'))||0,
    status: val('d_status') || 'Available', calibrated: val('d_cal') || TODAY });
  log(`Listed ${type} in inventory`, [me().id]);
  closeDialog();
  toast('Added to inventory', `${type} is now visible to the network.`, 'success');

function cycleDevice(deviceId){
  const cycle = ['Available','In Use','Returned','Maintenance'];
  const d = (me().devices || []).find(x => x.id === deviceId);
  if (!d) return;
  d.status = cycle[(cycle.indexOf(d.status) + 1) % cycle.length];
  toast('Status updated', `${d.type} is now ${d.status.toLowerCase()}.`);
  render();
}
function removeDevice(deviceId){
  const devs = me().devices || [];
  const i = devs.findIndex(d => d.id === deviceId);
  if (i < 0) return;
  const name = devs[i].type;
  devs.splice(i,1);
  toast('Removed from inventory', `${name} is no longer available to request.`, 'critical');
  render();
}
function decideRequest(reqId, decision){
  const r = byId(state.deviceRequests, reqId);
  r.status = decision;
  const { device } = findDevice(r.deviceId);
  if (device){
    if (decision === 'Approved') device.status = 'In Use';
    if (decision === 'Returned') device.status = 'Available';
  }
  const who = r.requesterType === 'aggregator' ? agg(r.requesterId) : biz(r.requesterId);
  log(`${decision} equipment request ${r.id} from ${who.name}`, [r.id, me().id, r.requesterId]);
  notify(r.requesterType, r.requesterId,
    `${deviceName(r.deviceId)} × ${r.qty} was ${decision.toLowerCase()}.`, 'equipment');
  toast(`Request ${decision.toLowerCase()}`, `${who.name} has been notified.`, decision === 'Rejected' ? 'critical' : 'success');
  render();
}

function contextLine(){
  const role = state.session.role, m = me();
  if (role === 'client')     return `${m.industry} · ${m.plan}`;
  if (role === 'tenant')     return `${m.hq} · ${m.qaPass}% QA pass`;
  if (role === 'aggregator') return `${m.region} · ${m.crowdSize.toLocaleString()} workers`;
  if (role === 'business')   return `${m.specialty}`;
  if (role === 'sponsor')    return `${(m.devices||[]).length} equipment types`;
  return 'All accounts';
}

function renderChrome(){
  const role = state.session.role;
  $('#ctxRole').textContent = ROLES[role].workspace;
  $('#ctxName').textContent = me().name;
  $('#ctxMeta').textContent = contextLine();

  $('#roleSel').innerHTML = Object.keys(ROLES).map(r =>
    `<option value="${r}"${r === role ? ' selected' : ''}>${ROLES[r].label}</option>`).join('');
  $('#orgSel').innerHTML = ROLES[role].accounts().map(o =>
    `<option value="${o.id}"${o.id === state.session.orgId ? ' selected' : ''}>${esc(o.name)}</option>`).join('');

  $('#railNav').innerHTML = `<div class="rail-group eyebrow">${ROLES[role].label}</div>` +
    NAV[role].map(([page,label,ic,count]) => {
      let n = ''; try { const c = count && count(); if (c) n = `<span class="tally">${c}</span>`; } catch(e){}
      const active = state.session.page === page;
      return `<button class="rail-item"${active ? ' aria-current="page"' : ''} onclick="go('${page}')">
        ${icon(ic)}<span class="lbl">${label}</span>${n}</button>`;
    }).join('');

  $('#railFoot').innerHTML = `<button class="rail-item"${state.session.page === 'designsystem' ? ' aria-current="page"' : ''}
    onclick="go('designsystem')">${icon('swatch')}<span class="lbl">Design system</span></button>`;

  const navItem = NAV[role].find(n => n[0] === state.session.page);
  const label = navItem ? navItem[1] : (CRUMB[state.session.page] || state.session.page);
  $('#crumbs').innerHTML = `<b>${esc(me().name)}</b><span class="sep">/</span><span>${esc(label)}</span>`;

  const unread = myNotifications().filter(n => !n.read).length;
  $('#bellBtn').innerHTML = icon('bell') + (unread ? `<span class="ping">${unread}</span>` : '');
  $('#bellBtn').setAttribute('aria-expanded', String(state.ui.bellOpen));
  $('#bellPop').innerHTML = state.ui.bellOpen ? notificationPop() : '';

  $('#themeBtn').innerHTML = icon(state.ui.theme === 'dark' ? 'moon' : state.ui.theme === 'light' ? 'sun' : 'auto');
  $('#themeBtn').setAttribute('aria-label',
    `Colour theme: ${state.ui.theme}. Activate to switch.`);
  $('#searchCue').innerHTML = `${icon('search',14)}<span class="lbl">Search</span><span class="k"><kbd class="kbd">Ctrl K</kbd></span>`;
  $('#railToggle').innerHTML = icon('menu');
  $('#rail').toggleAttribute('data-open', state.ui.railOpen);
}

function notificationPop(){
  const list = myNotifications();
  return `<div class="pop" role="region" aria-label="Notifications">
    <div class="pop-head"><b style="flex:1;font-size:13px">Notifications</b>
      ${list.some(n => !n.read) ? `<button class="btn" data-size="sm" onclick="markAllRead()">Mark all read</button>` : ''}</div>
    <div class="pop-list">${list.length ? list.map(n => `<button class="pop-item" onclick="openNotification('${n.id}')">
        <span style="color:var(--${n.read ? 'ink-4' : 'accent'});margin-top:2px">${icon(n.read ? 'check' : 'bell',13)}</span>
        <span class="txt">${esc(n.text)}<span class="ts">${fmtWhen(n.at)}</span></span></button>`).join('')
      : `<div class="empty" style="padding:26px 16px"><span class="body">Nothing new for this account.</span></div>`}</div>
  </div>`;
}
function toggleBell(){ state.ui.bellOpen = !state.ui.bellOpen; renderChrome(); }
function markAllRead(){ myNotifications().forEach(n => n.read = true); renderChrome(); }
function openNotification(id){
  const n = byId(state.notifications, id);
  n.read = true; state.ui.bellOpen = false;
  go(n.page, n.params);
}

/* --- theme: light / dark / system ---------------------------------------- */
function applyTheme(){
  const t = state.ui.theme;
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('sourcehub.theme', t); } catch(e){}
}
function cycleTheme(){
  const order = ['system','light','dark'];
  state.ui.theme = order[(order.indexOf(state.ui.theme) + 1) % order.length];
  applyTheme();
  renderChrome();
  toast('Theme: ' + state.ui.theme, state.ui.theme === 'system' ? 'Following your operating system.' : '');
}

/* --- toasts --------------------------------------------------------------- */
function toast(title, body, t){
  const el = document.createElement('div');
  el.className = 'toast';
  if (t) el.setAttribute('data-tone', t);
  el.innerHTML = `<span style="margin-top:1px;color:var(--t-${t || 'active'})">${icon(t === 'critical' ? 'alert' : 'check',15)}</span>
    <div><div class="tt">${esc(title)}</div>${body ? `<div class="tb">${esc(body)}</div>` : ''}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* --- dialog with a focus trap --------------------------------------------- */
let lastFocused = null;
function openDialog({ title, sub, body, foot, size }){
  lastFocused = document.activeElement;
  const d = $('#dialog');
  d.setAttribute('data-size', size || 'default');
  d.innerHTML = `<header class="dialog-head">
      <div class="titles"><h2 id="dialogTitle">${esc(title)}</h2>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>
      <button class="iconbtn" onclick="closeDialog()" aria-label="Close">${icon('x',14)}</button>
    </header>
    <div class="dialog-body">${body}</div>
    ${foot ? `<footer class="dialog-foot">${foot}</footer>` : ''}`;
  $('#dialogOverlay').setAttribute('data-open','');
  const first = d.querySelector('input,select,textarea,button:not([aria-label="Close"])');
  (first || d.querySelector('button')).focus();
}
function closeDialog(){
  $('#dialogOverlay').removeAttribute('data-open');
  $('#dialog').innerHTML = '';
  if (lastFocused && lastFocused.focus) lastFocused.focus();
  lastFocused = null;
}
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function trapFocus(e, container){
  const items = Array.from(container.querySelectorAll(FOCUSABLE)).filter(el => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

/* --- command palette ------------------------------------------------------ */
let paletteItems = [], paletteIndex = 0;
function buildPaletteItems(){
  const role = state.session.role;
  const items = NAV[role].map(([page,label]) => ({ label, where:'Page', run:() => go(page) }));
  items.push({ label:'Design system', where:'Page', run:() => go('designsystem') });
  Object.keys(ROLES).filter(r => r !== role).forEach(r =>
    items.push({ label:`Switch to ${ROLES[r].label}`, where:'Role', run:() => switchRole(r) }));
  if (role === 'client'){
    state.rfps.filter(r => r.clientId === state.session.orgId).forEach(r =>
      items.push({ label:`${r.id} · ${r.title}`, where:'Request', run:() => go('requestDetail',{ id:r.id }) }));
    state.contracts.filter(c => rfpOf(c.rfpId).clientId === state.session.orgId).forEach(c =>
      items.push({ label:`${c.id} · ${rfpOf(c.rfpId).title}`, where:'Delivery', run:() => go('deliveryDetail',{ id:c.id }) }));
  }
  if (role === 'tenant'){
    myContracts().forEach(c =>
      items.push({ label:`${c.id} · ${rfpOf(c.rfpId).title}`, where:'Contract', run:() => go('contractDetail',{ id:c.id }) }));
    openRfps().forEach(r =>
      items.push({ label:`${r.id} · ${r.title}`, where:'Opportunity', run:() => viewBrief(r.id) }));
  }
  return items;
}
function openPalette(){
  paletteItems = buildPaletteItems(); paletteIndex = 0;
  $('#paletteOverlay').setAttribute('data-open','');
  const input = $('#paletteInput');
  input.value = ''; renderPalette(''); input.focus();
}
function closePalette(){ $('#paletteOverlay').removeAttribute('data-open'); }
function renderPalette(q){
  const needle = q.toLowerCase();
  const hits = paletteItems.filter(i => i.label.toLowerCase().includes(needle)).slice(0,30);
  paletteIndex = Math.min(paletteIndex, Math.max(0, hits.length - 1));
  $('#paletteList').innerHTML = hits.length
    ? hits.map((i,n) => `<li role="option" aria-selected="${n === paletteIndex}"${n === paletteIndex ? ' data-active' : ''}
        onclick="runPalette(${n})" onmousemove="paletteIndex=${n};renderPalette(document.getElementById('paletteInput').value)">
        <span>${esc(i.label)}</span><span class="where">${i.where}</span></li>`).join('')
    : `<li aria-disabled="true"><span class="muted">Nothing matches “${esc(q)}”</span></li>`;
  $('#paletteList').dataset.count = hits.length;
}
function runPalette(n){
  const q = $('#paletteInput').value.toLowerCase();
  const hits = paletteItems.filter(i => i.label.toLowerCase().includes(q));
  const item = hits[n];
  if (!item) return;
  closePalette();
  item.run();
}

/* --- rail (mobile drawer) ------------------------------------------------- */
function toggleRail(){ state.ui.railOpen = !state.ui.railOpen; renderChrome(); }

/* ---------------------------------------------------------------------------
   §10 RENDER AND BOOT
--------------------------------------------------------------------------- */
function bootSkeleton(){
  const bar = w => `<div class="skeleton" style="width:${w}"></div>`;
  return `<div class="view-head"><div class="titles">${bar('280px')}<div style="height:6px"></div>${bar('420px')}</div></div>
    <div class="grid g4">${Array.from({length:4}, () => `<div class="metric">${bar('60%')}<div style="height:10px"></div>${bar('40%')}</div>`).join('')}</div>
    <section class="panel"><div class="panel-body">${Array.from({length:5}, () => `<div style="padding:7px 0">${bar((60 + Math.random()*35).toFixed(0) + '%')}</div>`).join('')}</div></section>`;
}
function render(){
  renderChrome();
  if (state.ui.booting){ $('#view').innerHTML = bootSkeleton(); return; }
  const role = state.session.role, page = state.session.page;
  const fn = PAGES[role][page] || PAGES.shared[page] || PAGES[role].overview;
  $('#view').innerHTML = fn();
}

/* event wiring */
$('#roleSel').addEventListener('change', e => switchRole(e.target.value));
$('#orgSel').addEventListener('change', e => switchAccount(e.target.value));
$('#themeBtn').addEventListener('click', cycleTheme);
$('#bellBtn').addEventListener('click', e => { e.stopPropagation(); toggleBell(); });
$('#searchCue').addEventListener('click', openPalette);
$('#railToggle').addEventListener('click', toggleRail);
$('#paletteInput').addEventListener('input', e => { paletteIndex = 0; renderPalette(e.target.value); });

document.addEventListener('click', e => {
  if (state.ui.bellOpen && !e.target.closest('.hostrel')) { state.ui.bellOpen = false; renderChrome(); }
  if (state.ui.railOpen && !e.target.closest('.rail') && !e.target.closest('.railtoggle')) { state.ui.railOpen = false; renderChrome(); }
});
$('#dialogOverlay').addEventListener('mousedown', e => { if (e.target.id === 'dialogOverlay') closeDialog(); });
$('#paletteOverlay').addEventListener('mousedown', e => { if (e.target.id === 'paletteOverlay') closePalette(); });

document.addEventListener('keydown', e => {
  const paletteOpen = $('#paletteOverlay').hasAttribute('data-open');
  const dialogOpen  = $('#dialogOverlay').hasAttribute('data-open');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); paletteOpen ? closePalette() : openPalette(); return; }
  if (e.key === 'Escape'){ if (paletteOpen) closePalette(); else if (dialogOpen) closeDialog(); return; }
  if (paletteOpen){
    const count = Number($('#paletteList').dataset.count || 0);
    if (e.key === 'ArrowDown'){ e.preventDefault(); paletteIndex = Math.min(paletteIndex + 1, count - 1); renderPalette($('#paletteInput').value); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); paletteIndex = Math.max(paletteIndex - 1, 0); renderPalette($('#paletteInput').value); }
    if (e.key === 'Enter'){ e.preventDefault(); runPalette(paletteIndex); }
    if (e.key === 'Tab') trapFocus(e, $('#paletteOverlay'));
    return;
  }
  if (dialogOpen && e.key === 'Tab') trapFocus(e, $('#dialog'));
});

/* boot: restore the theme, show the skeleton, then paint the real thing */
try {
  const saved = localStorage.getItem('sourcehub.theme');
  if (saved) state.ui.theme = saved;
} catch(e){}
applyTheme();
render();
setTimeout(() => { state.ui.booting = false; render(); }, 550);
</script>
