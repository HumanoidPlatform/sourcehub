plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.deidentify'
version = '0.1.0'

android {
  namespace "expo.modules.deidentify"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // The versions the app already ships: ML Kit through @react-native-ml-kit
  // (face-detection 16.1.7, text-recognition 16.0.1) and Media3 through
  // expo-video, which pins 1.9.0. Two versions of either in one APK is a
  // runtime fault, not a build error, so these follow theirs.
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  def media3 = "1.9.0"
  implementation "androidx.media3:media3-transformer:${media3}"
  implementation "androidx.media3:media3-effect:${media3}"
  implementation "androidx.media3:media3-common:${media3}"
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
