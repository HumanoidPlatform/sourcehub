# Serves the built console AND forwards /api to the API container. Referenced
# by the prod stage of frontend/Dockerfile.
#
# The forwarding is what makes one public port enough. The console calls
# /api/v1/... at its own origin and the phone calls <server>/api/v1/..., so
# both arrive here; nginx hands them to the API on the private Docker network.
# The API container publishes no port of its own and cannot be reached from
# outside. It also means no CORS: to the browser there is one origin.
#
# In deployment Caddy sits in front of this container and terminates HTTPS
# (infra/deploy/docker-compose.yml); this container then publishes no port
# either. Locally there may be nothing in front, and both cases must work.

# What the caller actually used. Caddy says "https"; with nothing in front the
# header is absent and nginx's own scheme is the truth. uvicorn builds redirect
# URLs from this, so passing a bare $scheme behind Caddy would send a browser
# on an https page to an http:// address.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Caddy every connection arrives from Caddy's container, so without
    # this $remote_addr would be Caddy's address and every sign-in attempt in
    # login_attempt would be recorded from it. Caddy discards a caller-supplied
    # X-Forwarded-For and writes the true peer, and only containers on the
    # private Docker networks can reach this one (it publishes no port behind
    # Caddy), so trusting the header from those ranges - and no others - is safe.
    # The ranges are Docker's default address pools.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;

    # Nothing here receives file bytes — captures and attachments are PUT
    # straight to blob storage with a presigned URL — so this only has to admit
    # JSON. A smaller ceiling than nginx's default 1m would start refusing
    # request drafts with long prose fields.
    client_max_body_size 5m;

    # --- the API ------------------------------------------------------------
    location /api/ {
        # Docker's own resolver, re-checked every 10s. Without it nginx would
        # look "api" up once at startup and cache that address forever: deploy a
        # new API container, it gets a new address, and every request 502s until
        # someone restarts nginx. valid=10s also means nginx starts even when
        # the API is not up yet, which is what lets the two boot in any order.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # uvicorn runs with --proxy-headers and trusts this header, so it
        # decides what address a sign-in attempt is recorded against.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The append form keeps
        # whatever the caller sent and adds the real peer after it, and uvicorn
        # reads the FIRST entry — so a caller could choose the address written
        # into login_attempt. I tested it against this stack: a request with
        # "X-Forwarded-For: 203.0.113.77" was recorded from 203.0.113.77, and
        # a non-IP value returned 500 from the login endpoint, because the
        # column is inet. nginx is the only hop here, so it should assert the
        # peer address rather than forward a claim.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Longer than the API's own slowest path (a presign that waits on
        # storage) and shorter than a user's patience.
        proxy_read_timeout    60s;

        # An API response is never the browser's to cache.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Liveness for whatever watches the VM. Same forwarding, no caching.
    location = /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_health http://api:8000;
        proxy_pass $api_health$request_uri;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # --- the console --------------------------------------------------------
    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers holding a stale entry point that references dead chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routing: every unknown path is a React route, not a 404.
    # Reloading /contracts/<id> has to serve the app, not fall through.
    location / {
        try_files $uri $uri/ /index.html;

        # Repeated rather than inherited. nginx's add_header does NOT inherit
        # into a location that sets any add_header of its own, so headers
        # declared once at server level silently vanish from exactly the
        # responses that carry the application.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
